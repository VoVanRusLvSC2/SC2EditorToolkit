name: Windows build and protocol tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: ./scripts/install-mpqcli.ps1
      - run: ./build.ps1 -WithVulkan
      - run: python -m unittest discover -s tests
      - run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SC2EditorToolkit-Windows-x64
          path: dist/
